<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 지도 · My Portfolio</title>
  <meta name="description" content="다녀온 나라와 도시, 국내 시군구를 표시한 여행 지도">
  <!-- 지도 라이브러리 Leaflet (스타일) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 메뉴 (메인 페이지와 같은 모양) -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">My Portfolio</a>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html#realestate">부동산 데이터 분석</a></li>
          <li><a href="index.html#hobby">← 취미생활</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <section id="travel" class="section tint-green">
      <div class="container">
        <h2>여행 지도</h2>
        <p class="section-desc">다녀온 나라는 색으로, 도시는 핀으로 표시했습니다. 한국을 누르거나 확대하면 시군구 지도로 바뀝니다.</p>

        <!-- 요약 (travel.js 가 채움) -->
        <p id="travel-summary" class="travel-summary"></p>

        <div class="chips" role="group" aria-label="지도 보기">
          <button type="button" class="chip on" id="view-world">세계</button>
          <button type="button" class="chip" id="view-korea">한국</button>
        </div>

        <!-- 지도 (travel.js 가 여기에 지도를 그립니다) -->
        <div id="travel-map" class="map travel-map"></div>
        <p class="travel-hint">마우스를 올리면 방문 시기가 나옵니다. 지도를 한 번 누른 뒤에는 마우스 휠로도 확대·축소할 수 있습니다.</p>

        <!-- 나라별 방문 목록 (travel.js 가 data/travel.json 을 읽어 채웁니다) -->
        <ul id="travel-list" class="travel-list"></ul>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 이름 · <a href="mailto:you@example.com">이메일</a> · <a href="https://github.com/aithrume">GitHub</a> · 국경: Natural Earth</p>
    </div>
  </footer>

  <!-- Leaflet 라이브러리 → 내 스크립트 순서로 불러와야 합니다 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="travel.js"></script>
<script>
window.onerror=function(m){document.title='ERR '+m};
setTimeout(function(){ var q=new URLSearchParams(location.search);
 if(q.get('k')) document.getElementById('view-korea').click();
 if(q.get('j')) document.querySelectorAll('.travel-item')[+q.get('j')].click();
 setTimeout(function(){ window.scrollTo(0, document.getElementById('travel').offsetTop - 60); }, 2500);
}, 2500);
</script></body>
</html>
