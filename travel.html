<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 지도 · My Portfolio</title>
  <meta name="description" content="다녀온 나라와 도시, 국내 시군구를 표시한 여행 지도">
  <meta property="og:type" content="website">
  <meta property="og:title" content="여행 지도 · My Portfolio">
  <meta property="og:description" content="다녀온 나라와 도시, 국내 시군구를 방문 연도별 색으로 표시한 세계·한국 여행 지도">
  <meta property="og:url" content="https://aithrume.github.io/travel.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="site-header" class="site-header"></header>

  <main>
    <section id="travel" class="section tint-green">
      <div class="container">
        <h2>여행 지도</h2>
        <p class="section-desc">다녀온 나라는 색으로, 도시는 핀으로 표시했습니다. 한국을 누르거나 확대하면 시군구 지도로 바뀌고, 좌하단 연도 범례를 누르면 시기별로 모아 볼 수 있습니다.</p>

        <p id="travel-summary" class="travel-summary"></p>

        <div class="chips" role="group" aria-label="지도 보기">
          <button type="button" class="chip on" id="view-world">세계</button>
          <button type="button" class="chip" id="view-korea">한국</button>
        </div>

        <div id="travel-map" class="map travel-map"></div>
        <p class="travel-hint">마우스를 올리면 방문 시기가 나옵니다. 좌하단 연도 범례를 누르면 해당 시기 방문 지역만 강조합니다.</p>

        <ul id="travel-list" class="travel-list"></ul>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer" data-extra="국경: Natural Earth"></footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="layout.js"></script>
  <script src="travel.js"></script>
</body>
</html>
