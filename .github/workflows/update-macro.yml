# 경제 지표 갱신 (금리 · 주요국 정책금리 · GDP)
# - 매월 15일 오전 9시(한국 시간)에 자동 실행합니다.
# - Actions 탭 → "경제 지표 갱신" → Run workflow 로 직접 실행할 수도 있습니다.
# - API 키는 저장소 Settings → Secrets and variables → Actions 의 BOK(한국은행 ECOS 인증키)에서 읽습니다.
name: 경제 지표 갱신

on:
  schedule:
    - cron: "0 0 15 * *"            # UTC 0시 = 한국 오전 9시, 매월 15일
  workflow_dispatch:

permissions:
  contents: write                   # 데이터 커밋·푸시
  pages: write                      # 사이트 다시 배포 요청

concurrency:
  group: update-macro               # 두 번 겹쳐 실행되지 않게
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul                # '갱신 날짜'를 한국 시간으로
      BOK: ${{ secrets.BOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 금리 (rates.json)
        run: python tools/build_rates.py

      - name: 주요국 정책금리 (policy.json)
        run: python tools/build_policy.py

      - name: GDP 성장률 (gdp.json)
        run: python tools/build_gdp.py

      - name: 바뀐 데이터 커밋·푸시
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro
          if git diff --cached --quiet; then
            echo "바뀐 데이터가 없습니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "경제 지표 자동 갱신 ($(date +%Y-%m-%d))"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 사이트 다시 배포 요청
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "배포 요청 실패 (다음 푸시 때 반영됩니다)"
