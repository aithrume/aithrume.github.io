<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>등산 GPX 기록 · My Portfolio</title>
  <meta name="description" content="다녀온 산과 가고 싶은 산의 GPX 기록 지도">
  <!-- 지도 라이브러리 Leaflet (스타일) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 메뉴 (메인 페이지와 같은 모양) -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">My Portfolio</a>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html#realestate">부동산 데이터 분석</a></li>
          <li><a href="index.html#hobby">← 취미생활</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <!-- 등산 GPX -->
    <section id="hiking" class="section tint-green">
      <div class="container">
        <h2>등산 GPX 기록</h2>
        <p class="section-desc">다녀온 산과 가고 싶은 산에 대한 GPX 정보입니다. 해당 항목을 누르면 해당 산의 지도가 표시됩니다</p>

        <!-- 지역 필터 (hiking.js 가 tracks.json 의 region 값으로 자동 생성) -->
        <div id="region-filter" class="chips" role="group" aria-label="지역별 보기"></div>

        <!-- 지도 (hiking.js 가 여기에 지도를 그립니다) -->
        <div id="map" class="map" style="height:480px"></div>
        <button id="show-all" type="button" class="map-btn">전체 보기</button>

        <!-- 산행 기록 목록 (hiking.js 가 tracks.json 을 읽어 자동으로 채웁니다) -->
        <ul id="track-list" class="track-list"></ul>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 이름 · <a href="mailto:you@example.com">이메일</a> · <a href="https://github.com/aithrume">GitHub</a></p>
    </div>
  </footer>

  <!-- Leaflet 라이브러리 → 내 스크립트 순서로 불러와야 합니다 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="hiking.js"></script>
</body>
</html>
