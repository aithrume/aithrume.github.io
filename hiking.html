<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>등산 GPX 기록 · My Portfolio</title>
  <meta name="description" content="다녀온 산과 가고 싶은 산의 GPX 기록 지도와 거리별 고도 프로필">
  <meta property="og:type" content="website">
  <meta property="og:title" content="등산 GPX 기록 · My Portfolio">
  <meta property="og:description" content="GPX 등산 경로와 거리별 고도 프로필을 지형도 위에 표시합니다.">
  <meta property="og:url" content="https://aithrume.github.io/hiking.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="site-header" class="site-header"></header>

  <main>
    <section id="hiking" class="section tint-green">
      <div class="container">
        <h2>등산 GPX 기록</h2>
        <p class="section-desc">다녀온 산과 가고 싶은 산에 대한 GPX 정보입니다. 항목을 누르면 지도가 확대되고 아래에 거리별 고도 프로필이 표시됩니다.</p>

        <!-- 지역 필터 -->
        <div id="region-filter" class="chips" role="group" aria-label="지역별 보기"></div>

        <!-- 지도 -->
        <div id="map" class="map" style="height:480px"></div>
        <button id="show-all" type="button" class="map-btn">전체 보기</button>

        <!-- 고도 프로필 (산을 선택하면 표시, 마우스를 올리면 지도 위 위치 연동) -->
        <div id="ele-card" class="ele-card" hidden>
          <div class="ele-head">
            <div>
              <strong id="ele-title">고도 프로필</strong>
              <span id="ele-stats" class="ele-stats"></span>
            </div>
            <span id="ele-hover" class="ele-hover" aria-live="polite"></span>
          </div>
          <svg id="ele-svg" class="ele-svg" viewBox="0 0 880 210" role="img" aria-label="선택한 산행의 거리별 고도 프로필 그래프"></svg>
        </div>

        <!-- 산행 기록 목록 -->
        <ul id="track-list" class="track-list"></ul>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="layout.js"></script>
  <script src="hiking.js"></script>
</body>
</html>
